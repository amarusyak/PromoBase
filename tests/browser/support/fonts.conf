<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Used by npm run test:browser and npm run screenshots: system-ui and
     sans-serif become Inter, so heights and screenshots come out the same on
     any Linux machine (D-117, D-127). Inter's metrics match what the owner
     measured on macOS (popup Add 523px, duplicate warning 588px). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
</fontconfig>
